<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">Three steps for one cross stitch through four existing holes: up at bottom left, down at top right, up at top left, down at bottom right. Weave the tail under back stitches.</title><rect width="900" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" font-size="19" fill="#18233a"><rect x="24" y="20" width="270" height="270" rx="12" fill="#fff6e8" stroke="#8c86a2"/><text x="159.0" y="55" text-anchor="middle" font-weight="700">1 · First diagonal</text><text x="159.0" y="85" text-anchor="middle" font-size="16"></text><circle cx="94" cy="100" r="8" fill="#805732"/><circle cx="224" cy="100" r="8" fill="#805732"/><circle cx="94" cy="220" r="8" fill="#805732"/><circle cx="224" cy="220" r="8" fill="#805732"/><path d="M94 220 L224 100" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><text x="59" y="250" font-size="16">up 1</text><text x="194" y="87" font-size="16">down 2</text><rect x="319" y="20" width="270" height="270" rx="12" fill="#fff6e8" stroke="#8c86a2"/><text x="454.0" y="55" text-anchor="middle" font-weight="700">2 · Complete the X</text><text x="454.0" y="85" text-anchor="middle" font-size="16"></text><circle cx="389" cy="100" r="8" fill="#805732"/><circle cx="519" cy="100" r="8" fill="#805732"/><circle cx="389" cy="220" r="8" fill="#805732"/><circle cx="519" cy="220" r="8" fill="#805732"/><path d="M389 220 L519 100" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><text x="354" y="250" font-size="16">up 1</text><text x="489" y="87" font-size="16">down 2</text><path d="M389 100 L519 220" fill="none" stroke="#168b88" stroke-width="5" stroke-linecap="round"/><text x="345" y="87" font-size="16">up 3</text><text x="489" y="250" font-size="16">down 4</text><rect x="614" y="20" width="270" height="270" rx="12" fill="#fff6e8" stroke="#8c86a2"/><text x="749.0" y="55" text-anchor="middle" font-weight="700">3 · Finish on the back</text><text x="749.0" y="85" text-anchor="middle" font-size="16"></text><circle cx="684" cy="100" r="8" fill="#805732"/><circle cx="814" cy="100" r="8" fill="#805732"/><circle cx="684" cy="220" r="8" fill="#805732"/><circle cx="814" cy="220" r="8" fill="#805732"/><path d="M684 100 L684 220" fill="none" stroke="#168b88" stroke-width="5" stroke-linecap="round"/><path d="M814 100 L814 220" fill="none" stroke="#168b88" stroke-width="5" stroke-linecap="round"/><path d="M644 160 Q684 130 714 160 T794 160 T859 160" fill="none" stroke="#5f3dc4" stroke-width="5"/><text x="642" y="269" font-size="14">Weave tail under back stitches</text><text x="30" y="326" font-size="17">Purple = working floss. Use existing holes; pull gently. This is ordinary, nonconductive floss.</text></g></svg>