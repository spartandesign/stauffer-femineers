<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">A verified power holder connects its positive terminal to a current-limited sewable LED positive terminal, and LED negative returns separately to holder negative. Paths never touch.</title><rect width="900" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" font-size="19" fill="#18233a"><rect x="30" y="80" width="220" height="150" rx="12" fill="#fff6e8" stroke="#8c86a2"/><text x="140.0" y="115" text-anchor="middle" font-weight="700">Approved holder</text><text x="140.0" y="145" text-anchor="middle" font-size="16">OFF for all changes</text><rect x="540" y="80" width="320" height="150" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="700.0" y="115" text-anchor="middle" font-weight="700">Verified sewable LED</text><text x="700.0" y="145" text-anchor="middle" font-size="16">Current limiting confirmed</text><path d="M250 120 L540 120" fill="none" stroke="#b83c30" stroke-width="5" stroke-linecap="round"/><text x="290" y="104" font-size="18">+ path → LED +</text><text x="223" y="126" font-size="23">+</text><text x="550" y="126" font-size="23">+</text><path d="M250 193 L540 193" fill="none" stroke="#18233a" stroke-width="5" stroke-linecap="round"/><text x="290" y="222" font-size="18">− path ← LED −</text><text x="223" y="199" font-size="23">−</text><text x="550" y="199" font-size="23">−</text><text x="35" y="42" font-size="18">COMPLETE LOOP · Match the exact LED and power source before assembly.</text><text x="35" y="280" font-size="17">Two separate conductive-thread lengths. No crossing or loose-tail bridge on either side.</text><text x="35" y="317" font-size="16">Conceptual map only: terminal locations and supply depend on the delivered components.</text></g></svg>