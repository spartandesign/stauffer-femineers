<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title"><title id="title">Thread the needle through its eye, then hold and capture the starting tail beneath the first back stitches.</title><rect width="900" height="280" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18233a"><rect x="20" y="20" width="410" height="235" rx="12" fill="#fff6e8" stroke="#c6b99f"/><text x="42" y="55" font-size="22" font-weight="700">1 · Thread the tested needle</text><path d="M100 125 L365 125 L390 133 L365 141 L100 141 Q74 133 100 125Z" fill="#c3cbd4" stroke="#526071" stroke-width="2"/><ellipse cx="108" cy="133" rx="14" ry="4" fill="#fff" stroke="#526071"/><path d="M48 196 Q110 184 108 135 Q105 81 165 88" fill="none" stroke="#5f3dc4" stroke-width="5"/><text x="180" y="89" font-size="17">short tail through eye</text><text x="43" y="225" font-size="17">Use a threader if needed; keep floss neat.</text><rect x="465" y="20" width="410" height="235" rx="12" fill="#fff6e8" stroke="#c6b99f"/><text x="487" y="55" font-size="22" font-weight="700">2 · Secure the start on the back</text><path d="M505 157 H807" stroke="#5f3dc4" stroke-width="5"/><path d="M554 100 V182 M629 100 V182 M704 100 V182" stroke="#168b88" stroke-width="6"/><text x="488" y="92" font-size="16">back stitches pass over the starting tail</text><text x="488" y="215" font-size="17">Hold tail flat for the first few stitches.</text><text x="488" y="239" font-size="17">Check that it stays secure before letting go.</text></g></svg>
