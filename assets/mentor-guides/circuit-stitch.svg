<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">Conductive sewing: several snug loops around a pad, a flat running stitch, and a front and back inspection for separated paths and short tails.</title><rect width="900" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" font-size="19" fill="#18233a"><rect x="20" y="20" width="275" height="250" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="157.5" y="55" text-anchor="middle" font-weight="700">1 · Wrap the pad</text><text x="157.5" y="85" text-anchor="middle" font-size="16"></text><circle cx="157" cy="140" r="37" fill="#ead49f" stroke="#9a680d"/><circle cx="157" cy="140" r="14" fill="#fff"/><path d="M136 126 Q100 182 160 180 L160 144" fill="none" stroke="#5f3dc4" stroke-width="3"/><path d="M146 126 Q110 182 170 180 L170 144" fill="none" stroke="#5f3dc4" stroke-width="3"/><path d="M156 126 Q120 182 180 180 L180 144" fill="none" stroke="#5f3dc4" stroke-width="3"/><text x="43" y="235" font-size="14">Several snug loops; flat contact</text><rect x="315" y="20" width="275" height="250" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="452.5" y="55" text-anchor="middle" font-weight="700">2 · Make a path</text><text x="452.5" y="85" text-anchor="middle" font-size="16"></text><path d="M350 135 L555 135" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round" stroke-dasharray="20 13"/><text x="345" y="190" font-size="16">Short running stitches</text><text x="345" y="220" font-size="16">One continuous thread</text><rect x="610" y="20" width="275" height="250" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="747.5" y="55" text-anchor="middle" font-weight="700">3 · Check the back</text><text x="747.5" y="85" text-anchor="middle" font-size="16"></text><path d="M640 115 L850 115" fill="none" stroke="#b83c30" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 10"/><path d="M640 190 L850 190" fill="none" stroke="#18233a" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 10"/><text x="640" y="153" font-size="16">Clear gap; trimmed tails</text><text x="640" y="239" font-size="16">Inspect front AND back</text><text x="25" y="316" font-size="17">Practice on felt with power removed. Keep the positive and negative paths separate.</text></g></svg>