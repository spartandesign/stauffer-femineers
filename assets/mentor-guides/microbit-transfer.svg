<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">Four-step Windows workflow: build and simulate, transfer by USB data cable, wait for flashing to finish, unplug USB then attach the two-AAA holder and test.</title><rect width="900" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" font-size="19" fill="#18233a"><rect x="25" y="35" width="400" height="115" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="225.0" y="70" text-anchor="middle" font-weight="700">1 · Build + simulate</text><text x="225.0" y="100" text-anchor="middle" font-size="16">Windows laptop · MakeCode</text><rect x="475" y="35" width="400" height="115" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="675.0" y="70" text-anchor="middle" font-weight="700">2 · Transfer by USB</text><text x="675.0" y="100" text-anchor="middle" font-size="16">Data cable · W-labeled board</text><rect x="25" y="195" width="400" height="115" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="225.0" y="230" text-anchor="middle" font-weight="700">3 · Wait for completion</text><text x="225.0" y="260" text-anchor="middle" font-size="16">Do not unplug while flashing</text><rect x="475" y="195" width="400" height="115" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="675.0" y="230" text-anchor="middle" font-weight="700">4 · Test on battery</text><text x="675.0" y="260" text-anchor="middle" font-size="16">USB out; then 2×AAA holder</text><path d="M435 92 L465 92" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><text x="440" y="117" font-size="23">→</text><path d="M675 160 V176 H225 V185" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><path d="M435 252 L465 252" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/></g></svg>