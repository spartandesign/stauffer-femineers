<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">BirdBlox on an assigned iPad connects to the Hummingbird with an R-labeled microbit. Distance sensor uses SENSORS 1, LED uses LEDS 1, secured position servo uses SERVOS 1.</title><rect width="900" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" font-size="19" fill="#18233a"><rect x="25" y="25" width="350" height="92" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="200.0" y="60" text-anchor="middle" font-weight="700">Assigned iPad</text><text x="200.0" y="90" text-anchor="middle" font-size="16">BirdBlox · correct device name</text><rect x="470" y="25" width="400" height="92" rx="12" fill="#f1ebff" stroke="#8c86a2"/><text x="670.0" y="60" text-anchor="middle" font-weight="700">Hummingbird + R micro:bit</text><text x="670.0" y="90" text-anchor="middle" font-size="16">BirdBrain Bluetooth firmware</text><path d="M382 70 L460 70" fill="none" stroke="#168b88" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 7"/><text x="385" y="55" font-size="13">Bluetooth</text><rect x="25" y="195" width="265" height="105" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="157.5" y="230" text-anchor="middle" font-weight="700">SENSORS 1</text><text x="157.5" y="260" text-anchor="middle" font-size="16"></text><text x="37" y="251" font-size="16">Distance</text><text x="37" y="279" font-size="13">yellow S / red + / black −</text><path d="M157 185 L157 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><path d="M157 155 L670 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><rect x="320" y="195" width="265" height="105" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="452.5" y="230" text-anchor="middle" font-weight="700">LEDS 1</text><text x="452.5" y="260" text-anchor="middle" font-size="16"></text><text x="332" y="251" font-size="16">Single color</text><text x="332" y="279" font-size="13">colored + / black −</text><path d="M452 185 L452 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><path d="M452 155 L670 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><rect x="615" y="195" width="265" height="105" rx="12" fill="#eaf8f6" stroke="#8c86a2"/><text x="747.5" y="230" text-anchor="middle" font-weight="700">SERVOS 1</text><text x="747.5" y="260" text-anchor="middle" font-size="16"></text><text x="627" y="251" font-size="16">Position</text><text x="627" y="279" font-size="13">white S / red + / black −</text><path d="M747 185 L747 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><path d="M747 155 L670 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><path d="M670 117 L670 155" fill="none" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><text x="27" y="335" font-size="16">Port map, not a board layout. Read printed terminal labels; match the actual kit’s wire colors.</text></g></svg>